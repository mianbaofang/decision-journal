[project]
name = "decision-journal"
version = "0.10.0"
description = "Local-first AI decision assistant with Web, CLI, and installable Skill interfaces"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Decision Journal Contributors" }]
readme = "README.md"
keywords = ["decision-making", "decision-support", "ai-assistant", "local-first", "fastapi", "sqlite", "openai-compatible", "decision-journal", "decision-log"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2",
    "python-multipart",
    "edge-tts",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "playwright"]

[project.scripts]
decision-journal = "scripts.decision_journal:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.models", "backend.routes", "backend.services", "frontend", "scripts"]

[tool.setuptools.package-data]
# 让 pip 安装后的 console script 也能启动带 Web UI 的本地后端。
frontend = ["*.html", "assets/*", "scripts/*.js", "styles/*.css", "vendor/*"]
